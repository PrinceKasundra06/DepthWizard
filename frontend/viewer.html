<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Viewer | DepthWizard</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Three.js for frontend 3D rendering -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>
    <!-- Background Effects -->
    <div class="noise-overlay"></div>

    <nav>
        <div class="logo">DepthWizard</div>
        <div class="nav-links">
            <a href="index.html">Home</a>
            <a href="upload.html">Upload</a>
            <a href="about.html">About</a>
        </div>
    </nav>

    <main class="container reveal">
        <div class="viewer-header">
            <h2>Your 3D Flythrough</h2>
            <p style="color: var(--text-muted); font-size: 1.05rem; margin-top: 0.5rem;">Use your mouse to rotate and zoom around the generated landscape.</p>
        </div>

        <div class="viewer-container interactive-card" id="canvas-container">
            <!-- 3D Canvas will be injected here -->
        </div>

        <div class="viewer-controls reveal reveal-delay-1">
            <button class="btn">Download .OBJ</button>
            <button class="btn btn-outline">Download Depth Map</button>
            <a href="upload.html" class="btn btn-outline">Process Another</a>
        </div>
    </main>

    <footer style="margin-top: 0;">
        <div class="footer-content">
            <div class="footer-brand">DepthWizard</div>
            <div class="footer-links">
                <a href="index.html">Home</a>
                <a href="upload.html">Upload</a>
                <a href="about.html">About</a>
                <a href="#">Privacy</a>
                <a href="#">Terms</a>
            </div>
        </div>
        <div class="footer-bottom">
            © 2026 DepthWizard Inc. All rights reserved. System Operational.
        </div>
    </footer>

    <script src="js/viewer.js"></script>
    <script src="js/main.js"></script>
</body>
</html>
